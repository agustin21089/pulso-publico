name: Publicar PULSO y actualizar observaciones
on:
  push:
    branches: [main]
    paths: ["site/**", "jobs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      diagnose_pna:
        description: "Comprobar acceso a Prefectura sin desplegar"
        type: boolean
        default: false
  schedule:
    - cron: "17 0,3,6,9,12,18,21 * * *"
    - cron: "17 15 * * *"
permissions:
  contents: read
concurrency:
  group: pulso-pages-production
  cancel-in-progress: false
jobs:
  pna_connectivity:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_pna
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Consultar Rosario en Prefectura
        shell: bash
        run: |
          curl --ipv4 --fail --location --silent --show-error --max-time 30 https://contenidosweb.prefecturanaval.gob.ar/alturas/index.php -o pna.html
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const body=readFileSync('pna.html','utf8');
          const row=[...body.matchAll(/<tr\b[^>]*>([\s\S]*?)<\/tr>/gi)].map(m=>m[1]).find(s=>/data-label="Puerto:"[^>]*>\s*ROSARIO/i.test(s));
          if(!row) throw Error('Rosario ausente');
          console.log(row.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim());
          JS
  prepare:
    if: github.event_name != 'workflow_dispatch' || !inputs.diagnose_pna
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            data/territory
            !data/territory/.lock
          key: territorio-v1-${{ runner.os }}-${{ hashFiles('jobs/territory/config/**', 'jobs/territory/*.py') }}-${{ github.run_id }}
          restore-keys: |
            territorio-v1-${{ runner.os }}-${{ hashFiles('jobs/territory/config/**', 'jobs/territory/*.py') }}-
      - name: Instalar procesamiento satelital abierto
        if: github.event_name != 'schedule' || github.event.schedule == '17 15 * * *'
        run: python -m pip install -r jobs/territory/requirements.txt
      - name: Recuperar histórico satelital publicado
        run: python jobs/territory/restore.py
      - name: Consultar y procesar nuevas escenas con presupuesto acotado
        if: github.event_name != 'schedule' || github.event.schedule == '17 15 * * *'
        timeout-minutes: 12
        continue-on-error: true
        run: python jobs/territory/pipeline.py --config jobs/territory/config --max-scenes 2
      - name: Incorporar histórico satelital disponible
        run: |
          if [ -f data/territory/manifest.json ]; then
            node jobs/territory/export.mjs data/territory site/territory
          fi
      - name: Obtener y validar las fuentes públicas configuradas
        run: node jobs/refresh-data.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar corte verificado
        id: deployment
        uses: actions/deploy-pages@v4
